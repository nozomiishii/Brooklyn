name: Brooklyn
options:
  bundleIdPrefix: dev.nozomiishii
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    MARKETING_VERSION: "2.2.1" # x-release-please-version

targets:
  # Host app. Exists to carry the screen saver extension at a stable path
  # (/Applications) and to register it; the saver itself is BrooklynExtension.
  Brooklyn:
    type: application
    platform: macOS
    sources:
      - path: BrooklynApp
    settings:
      base:
        PRODUCT_NAME: Brooklyn
        PRODUCT_BUNDLE_IDENTIFIER: dev.nozomiishii.brooklyn
        INFOPLIST_FILE: BrooklynApp/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 旧ブランドアイコン (AppIconClassic) も Assets.car に含める。
        # BrooklynApp/AppIcon.swift が NSImage(named:) で引く
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - target: BrooklynExtension

  # ScreenSaver App Extension (NSExtensionPointIdentifier: com.apple.screensaver).
  # Runs as its own sandboxed process; System Settings lists it next to Apple's
  # built-in savers.
  BrooklynExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: BrooklynExtension
      - path: Shared/Sources
      - path: Shared/ConfigureSheet
      - path: Shared/Resources/Animations
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: BrooklynExtension
        PRODUCT_BUNDLE_IDENTIFIER: dev.nozomiishii.brooklyn.extension
        INFOPLIST_FILE: BrooklynExtension/Info.plist
        GENERATE_INFOPLIST_FILE: false
        SWIFT_OBJC_BRIDGING_HEADER: BrooklynExtension/BrooklynExtension-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: BrooklynExtension/BrooklynExtension.entitlements
        COMBINE_HIDPI_IMAGES: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/../Frameworks"
    dependencies:
      - framework: ScreenSaver.framework
        embed: false
      - sdk: AVFoundation.framework
      - sdk: SwiftUI.framework

  Canvas:
    type: application
    platform: macOS
    sources:
      - path: Canvas
      - path: Shared/Sources
      - path: Shared/ConfigureSheet
      - path: Shared/Resources/Animations
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Canvas
        PRODUCT_BUNDLE_IDENTIFIER: dev.nozomiishii.brooklyn.canvas
        INFOPLIST_FILE: Canvas/Info.plist
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - framework: ScreenSaver.framework
        embed: false
      - sdk: AVFoundation.framework
      - sdk: SwiftUI.framework

  BrooklynTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BrooklynTests
      - path: Shared/Sources
      - path: Shared/ConfigureSheet
      - path: Shared/Resources/Animations
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: BrooklynTests
        PRODUCT_BUNDLE_IDENTIFIER: dev.nozomiishii.brooklyn.tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - framework: ScreenSaver.framework
        embed: false
      - sdk: AVFoundation.framework
      - sdk: SwiftUI.framework
