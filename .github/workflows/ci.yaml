name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# デフォルト権限を無効化し、各ジョブで必要最小限の権限のみ付与する
permissions: {}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read  # required by actions/checkout to fetch repository code

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Mint
        run: brew install mint

      - name: Cache Mint packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.mint
          key: mint-${{ runner.os }}-${{ hashFiles('Mintfile') }}
          restore-keys: mint-${{ runner.os }}-

      - name: Bootstrap tools
        run: mint bootstrap

      - name: Lint
        run: make lint

      - name: Format check
        run: make format-check

  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read  # required by actions/checkout to fetch repository code

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build
        run: make build

      - name: Verify arm64 binaries
        run: |
          APP=build/Build/Products/Release/Brooklyn.app
          lipo -info "$APP/Contents/MacOS/Brooklyn"
          lipo -info "$APP/Contents/MacOS/Brooklyn" | grep "arm64"
          APPEX="$APP/Contents/PlugIns/BrooklynExtension.appex"
          lipo -info "$APPEX/Contents/MacOS/BrooklynExtension"
          lipo -info "$APPEX/Contents/MacOS/BrooklynExtension" | grep "arm64"

      - name: Verify animations are bundled
        run: |
          APPEX=build/Build/Products/Release/Brooklyn.app/Contents/PlugIns/BrooklynExtension.appex
          count=$(find "$APPEX/Contents/Resources/Animations" -name "*.mp4" | wc -l | tr -d ' ')
          echo "Found $count MP4 files"
          [ "$count" -eq 75 ] || (echo "Expected 75 MP4 files, got $count" && exit 1)

      - name: Run tests
        run: make test

  required:
    # name 変更時は infra 側の required_status_checks も更新する
    name: CI / required
    needs: [lint, build-and-test]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A required job failed or was cancelled"
          exit 1
