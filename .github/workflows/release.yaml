name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

defaults:
  run:
    shell: bash

# 同時実行を防止し、release-pr が未完了のリリースを参照する競合を回避する
concurrency:
  group: release
  cancel-in-progress: false

# デフォルト権限を無効化し、各ジョブで必要最小限の権限のみ付与する
permissions: {}

jobs:
  # release PR がマージされていれば draft release + tag を作成
  create-draft-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # required by release-please to create draft releases and tags
      issues: write  # kept to match release-please's documented permission set (avoids divergence-debugging later)
      pull-requests: write  # required by release-please to create/update release PRs

    outputs:
      release_created: ${{ steps.detect.outputs.release_created }}
      tag_name: ${{ steps.detect.outputs.tag_name }}

    steps:
      - name: Load secrets from 1Password
        id: secrets
        uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        with:
          # renovate: datasource=docker depName=1password/op versioning=semver
          version: "2.39.0"
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_ID: op://nozomiishii-release/github-app/username
          APP_PRIVATE_KEY: op://nozomiishii-release/github-app/credential

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ steps.secrets.outputs.APP_ID }}
          private-key: ${{ steps.secrets.outputs.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write  # kept to match release-please's documented permission set (avoids divergence-debugging later)
          permission-pull-requests: write
          # GitHub requires workflows:write to create a release/tag on a commit that is
          # not the current branch head. release-please tags the (already-merged, now
          # non-head) release commit, so without this the create-release call returns
          # 403 "Resource not accessible by integration".
          permission-workflows: write

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run release-please github-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_URL: ${{ github.repository }}
        run: |
          npx --yes release-please@17.11.1 github-release \
            --repo-url="${REPO_URL}" \
            --config-file=.github/.release-please-config.json \
            --manifest-file=.github/.release-please-manifest.json \
            --token="${GITHUB_TOKEN}"

      - name: Detect created release
        id: detect
        run: |
          VERSION=$(jq -r '."."' .github/.release-please-manifest.json)
          TAG_NAME="v${VERSION}"
          if gh release view "${TAG_NAME}" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q 'true'; then
            echo "release_created=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "release_created=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  # ビルド + アセット upload + draft release を publish
  upload-assets:
    needs: create-draft-release
    if: needs.create-draft-release.outputs.release_created == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write  # required by gh release upload/edit to publish release assets
    steps:
      - name: Load secrets from 1Password
        id: secrets
        uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        with:
          # renovate: datasource=docker depName=1password/op versioning=semver
          version: "2.39.0"
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_ID: op://nozomiishii-release/github-app/username
          APP_PRIVATE_KEY: op://nozomiishii-release/github-app/credential
          # Apple の鍵は専用 vault。apple-developer vault を読めるのは Brooklyn の
          # service account だけにし、他リポジトリの CI 侵害から署名鍵を隔離する
          # (詳細: docs/release.md)
          APPLE_CERTIFICATE_P12: op://apple-developer/developer-id/certificate-p12
          APPLE_P12_PASSWORD: op://apple-developer/developer-id/p12-password
          ASC_KEY_ID: op://apple-developer/app-store-connect/key-id
          ASC_ISSUER_ID: op://apple-developer/app-store-connect/issuer-id
          ASC_PRIVATE_KEY: op://apple-developer/app-store-connect/private-key

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ steps.secrets.outputs.APP_ID }}
          private-key: ${{ steps.secrets.outputs.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.create-draft-release.outputs.tag_name }}
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build
        run: make build

      - name: Run tests
        run: make test

      # .p12 を一時キーチェーンに取り込む (詳細: docs/release.md)
      # Apple 公式の CI 署名ツールが出たら置き換える:
      # https://github.com/nozomiishii/Brooklyn/issues/140
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ steps.secrets.outputs.APPLE_CERTIFICATE_P12 }}
          APPLE_P12_PASSWORD: ${{ steps.secrets.outputs.APPLE_P12_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo -n "$APPLE_CERTIFICATE_P12" | base64 --decode -o "$CERT_PATH"

          # 使い捨てのキーチェーンをマスターパスワード付きで作る
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # 自動ロックまでの時間を 6 時間にし、job 中のロックを防ぐ
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          # マスターパスワードでロックを解除する
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 証明書 + 秘密鍵を .p12 から取り込む
          security import "$CERT_PATH" \
            -P "$APPLE_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # 鍵の使用許可ダイアログの「常に許可」を先に押しておく相当の設定
          security set-key-partition-list \
            -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # codesign が鍵を探す検索対象にこのキーチェーンを載せる
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          rm "$CERT_PATH"

      # Developer ID 署名。フラグは公証の必須要件 (詳細: docs/release.md)
      - name: Sign .saver
        run: |
          # identity はキーチェーンに 1 つだけなので自動検出
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/signing.keychain-db" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in keychain"
            exit 1
          fi

          # 秘密鍵でバンドルに署名し、証明書 (公開鍵) を同梱する
          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY" \
            build/Build/Products/Release/Brooklyn.saver

          # 署名が壊れていないか再検証し、署名内容をログに残す
          codesign --verify --strict --verbose=2 \
            build/Build/Products/Release/Brooklyn.saver
          codesign --display --verbose=2 \
            build/Build/Products/Release/Brooklyn.saver

      # Apple にスキャンさせ、公証チケットを .saver に staple する
      - name: Notarize and staple
        env:
          ASC_KEY_ID: ${{ steps.secrets.outputs.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ steps.secrets.outputs.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ steps.secrets.outputs.ASC_PRIVATE_KEY }}
        run: |
          # 公証キー (.p8) を base64 から復元する (PEM の改行が
          # フィールド経由で失われるのを防ぐため base64 で保存している)
          KEY_PATH="$RUNNER_TEMP/asc-key.p8"
          echo -n "$ASC_PRIVATE_KEY" | base64 --decode -o "$KEY_PATH"

          # 提出用に zip 梱包する
          cd build/Build/Products/Release
          ditto -c -k --keepParent Brooklyn.saver notarize.zip

          # 公証キーで本人確認し、Apple の検査に提出して合格を待つ
          SUBMIT_JSON=$(xcrun notarytool submit notarize.zip \
            --key "$KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait --output-format json)
          echo "$SUBMIT_JSON" | jq .

          # 不合格なら検査ログを出力して fail する
          STATUS=$(echo "$SUBMIT_JSON" | jq -r '.status')
          if [ "$STATUS" != "Accepted" ]; then
            SUBMISSION_ID=$(echo "$SUBMIT_JSON" | jq -r '.id')
            echo "::error::Notarization failed with status: ${STATUS}"
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$KEY_PATH" \
              --key-id "$ASC_KEY_ID" \
              --issuer "$ASC_ISSUER_ID"
            exit 1
          fi

          # 合格チケットをバンドルに添付し、オフラインでも検証できるようにする
          xcrun stapler staple Brooklyn.saver
          xcrun stapler validate Brooklyn.saver

          # 提出用 zip を削除する (配布物は後段の Package step で作り直す)
          rm notarize.zip

      - name: Package .saver
        run: |
          cd build/Build/Products/Release
          zip -r Brooklyn.saver.zip Brooklyn.saver

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG_NAME: ${{ needs.create-draft-release.outputs.tag_name }}
        run: |
          gh release upload "${TAG_NAME}" \
            build/Build/Products/Release/Brooklyn.saver.zip

      - name: Publish Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG_NAME: ${{ needs.create-draft-release.outputs.tag_name }}
        run: |
          gh release edit "${TAG_NAME}" \
            --draft=false

      # runner は ephemeral だが、署名鍵は job 終了を待たず明示的に破棄する
      - name: Clean up signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/asc-key.p8"

  # publish 後に次の release PR を作成/更新
  release-pr:
    needs: [create-draft-release, upload-assets]
    if: ${{ always() && !cancelled() && needs.upload-assets.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # required by release-please to create the release PR branch
      pull-requests: write  # required by release-please to create/update release PRs

    steps:
      - name: Load secrets from 1Password
        id: secrets
        uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        with:
          # renovate: datasource=docker depName=1password/op versioning=semver
          version: "2.39.0"
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_ID: op://nozomiishii-release/github-app/username
          APP_PRIVATE_KEY: op://nozomiishii-release/github-app/credential

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ steps.secrets.outputs.APP_ID }}
          private-key: ${{ steps.secrets.outputs.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run release-please release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_URL: ${{ github.repository }}
        run: |
          npx --yes release-please@17.11.1 release-pr \
            --repo-url="${REPO_URL}" \
            --config-file=.github/.release-please-config.json \
            --manifest-file=.github/.release-please-manifest.json \
            --token="${GITHUB_TOKEN}"

  homebrew-update:
    needs: [create-draft-release, upload-assets]
    if: needs.create-draft-release.outputs.release_created == 'true'
    runs-on: macos-26
    timeout-minutes: 10
    concurrency:
      group: homebrew-update
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Load secrets from 1Password
        id: secrets
        uses: 1password/load-secrets-action@e544b780808654ba8ceba5fb2fe2897103d92ff4 # v5.0.0
        with:
          # renovate: datasource=docker depName=1password/op versioning=semver
          version: "2.39.0"
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_ID: op://nozomiishii-release/github-app/username
          APP_PRIVATE_KEY: op://nozomiishii-release/github-app/credential

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ steps.secrets.outputs.APP_ID }}
          private-key: ${{ steps.secrets.outputs.APP_PRIVATE_KEY }}
          owner: nozomiishii
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Bump cask file (write only)
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG_NAME: ${{ needs.create-draft-release.outputs.tag_name }}
        run: |
          set -x
          VERSION="${TAG_NAME#v}"
          brew tap nozomiishii/homebrew-tap
          # `--write-only` だとファイル書き換え + brew style --fix + brew audit のみ
          # 走り、commit/push/PR 作成は行われない。後段で自前に PR を作ることで
          # PR title を最初から Conventional Commits 形式にし、CI の二重起動を避ける。
          brew bump-cask-pr \
            --write-only \
            --version="$VERSION" \
            nozomiishii/tap/brooklyn

      # mise の brew-cask manager は tap の `api/cask/<token>.json` から cask の
      # メタデータを取得する。bump した `.rb` と同じコミットに載せないと
      # version / sha256 がズレたまま公開されるため、ここで再生成する。
      - name: Regenerate cask API metadata
        run: |
          set -x
          cd "$(brew --repository nozomiishii/homebrew-tap)"
          # 引数の tap 名は生成物の正規化に使うほか、Homebrew の tap trust
          # チェックを満たす (ARGV に tap 名があれば明示的に許可される)。
          brew ruby scripts/generate-cask-api.rb nozomiishii/tap

      - name: Commit, push and open PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG_NAME: ${{ needs.create-draft-release.outputs.tag_name }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -x
          TAP_DIR="$(brew --repository nozomiishii/homebrew-tap)"
          cd "$TAP_DIR"

          BRANCH="bump-brooklyn-${TAG_NAME}"
          MSG="chore: update brooklyn to ${TAG_NAME}"
          git config user.name "nozomiishii-release[bot]"
          git config user.email "nozomiishii-release[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Casks/brooklyn.rb api/cask/brooklyn.json
          git commit -m "$MSG"
          AUTH=$(echo -n "x-access-token:${HOMEBREW_GITHUB_API_TOKEN}" | base64)
          git -c "http.extraheader=Authorization: Basic ${AUTH}" push -u origin "$BRANCH"

          # `gh pr create` が失敗すると push したブランチだけが remote に残り、
          # 孤立ブランチが溜まる。EXIT trap で roll-back し、PR 作成成功後は
          # PR_CREATED=1 で抑止する。`gh pr merge --auto` の失敗時はブランチを
          # 残す（PR は作成済みなので手動 merge で進められる）。
          PR_CREATED=0
          cleanup_orphan_branch() {
            if [ "$PR_CREATED" = "0" ]; then
              echo "::warning::PR not created — deleting orphan branch ${BRANCH}"
              git -c "http.extraheader=Authorization: Basic ${AUTH}" \
                push origin --delete "$BRANCH" || true
            fi
          }
          trap cleanup_orphan_branch EXIT

          # release-please の release PR (head commit が `chore: release X.Y.Z (#N)`)
          # から起動した場合は `(#N)` を抽出して release PR リンクも併記する。
          BODY="Release Note: [Brooklyn ${TAG_NAME}](https://github.com/nozomiishii/Brooklyn/releases/tag/${TAG_NAME})"
          RELEASE_PR_NUMBER="$(printf '%s\n' "$HEAD_COMMIT_MESSAGE" | head -1 | grep -oE '#[0-9]+' | head -1 | tr -d '#')"
          if [ -n "$RELEASE_PR_NUMBER" ]; then
            BODY="${BODY}"$'\n\n'"Release PR: https://github.com/nozomiishii/Brooklyn/pull/${RELEASE_PR_NUMBER}"
          fi

          PR_URL=$(gh pr create \
            --repo nozomiishii/homebrew-tap \
            --base main \
            --head "$BRANCH" \
            --title "$MSG" \
            --body "$BODY")
          PR_CREATED=1

          gh pr merge "$PR_URL" --auto --squash
